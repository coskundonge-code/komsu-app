name: CI

# K7 — ilk otomatik kapı: her push/PR'de lint + typecheck + test + bağımlılık taraması.
on:
  push:
    branches: [main, coskun]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint + Typecheck simdilik BILGI amacli (continue-on-error): mevcut kod borcu
      # (~96 tip + ~343 lint) loglarda gorunur ama job'i KIRMAZ. Faz 1'de borc
      # temizlenince zorunlu kapiya cevrilecek — bkz. TECH_DEBT.md.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck (informational)
        run: npx tsc --noEmit
        continue-on-error: true

      # GERCEK KAPI: testler gecmezse job KIRMIZI olur.
      - name: Unit tests
        run: npm run test

      # Bilgilendirme amaçlı: Faz 1'de "yüksek ve üzeri = kırmızı" zorunlu kapıya çevrilecek.
      - name: Dependency audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
