name: CI

# K7 — ilk otomatik kapı: her push/PR'de lint + typecheck + test + bağımlılık taraması.
on:
  push:
    branches: [main, coskun]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      # Bilgilendirme amaçlı: Faz 1'de "yüksek ve üzeri = kırmızı" zorunlu kapıya çevrilecek.
      - name: Dependency audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
