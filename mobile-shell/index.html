<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mahallemiz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #00833e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 72px; height: 72px;
      background: rgba(255,255,255,.15);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 800;
      margin: 0 auto 20px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { font-size: 14px; opacity: .9; line-height: 1.5; max-width: 280px; margin: 0 auto 24px; }
    button {
      background: #fff; color: #00833e;
      border: 0; border-radius: 12px;
      padding: 12px 28px;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Hibrit kabuğun yerel yedek ekranı: normalde uygulama canlı siteyi yükler
       (capacitor.config server.url); bu sayfa yalnızca bağlantı yokken görünür. -->
  <div>
    <div class="logo">M</div>
    <h1>İnternet bağlantısı gerekli</h1>
    <p>Mahallemiz'e ulaşmak için internet bağlantınızı kontrol edip tekrar deneyin.</p>
    <button onclick="window.location.href='https://komsu-app.vercel.app'">Tekrar Dene</button>
  </div>
</body>
</html>
